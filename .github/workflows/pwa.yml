name: PWA Peserta (build)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/peserta-pwa/**', '.github/workflows/pwa.yml']
  pull_request:
    paths: ['apps/peserta-pwa/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Pasang dependensi
        run: npm install
      - name: TypeScript + build produksi
        run: npm run build --workspace @fg/peserta-pwa
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: peserta-pwa-dist
          path: apps/peserta-pwa/dist
