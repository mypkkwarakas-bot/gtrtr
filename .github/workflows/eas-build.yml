name: Cek kode (TypeScript + Expo)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Pasang dependensi
        run: npm install
      - name: TypeScript (semua workspace)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Versi paket sesuai Expo SDK (Admin)
        working-directory: apps/admin
        run: npx expo install --check
        continue-on-error: true
      - name: Versi paket sesuai Expo SDK (Kepala)
        working-directory: apps/kepala
        run: npx expo install --check
        continue-on-error: true
      - name: Expo Doctor (Admin)
        working-directory: apps/admin
        run: npx expo-doctor
        continue-on-error: true
      - name: Expo Doctor (Kepala)
        working-directory: apps/kepala
        run: npx expo-doctor
        continue-on-error: true
